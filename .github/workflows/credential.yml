# Applies a "Credential" issue (.github/ISSUE_TEMPLATE/credential.yml) to content/resume.json,
# commits it (which redeploys the site) and closes the issue. Only the repo owner's issues are
# applied: anyone can open an issue on a public repo. Issue text reaches the script through the
# event payload file, never through ${{ }} expressions in a shell.
name: Apply credential

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

concurrency:
  group: credential
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.issue.state == 'open' &&
      github.event.issue.user.login == github.repository_owner &&
      contains(github.event.issue.labels.*.name, 'credential')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ github.event.issue.number }}
      BRANCH: ${{ github.event.repository.default_branch }}
      AUTHOR: ${{ github.repository_owner }} <${{ github.event.issue.user.id }}+${{ github.repository_owner }}@users.noreply.github.com>
    steps:
      # The runner context isn't available in job-level env, so the temp paths are set here.
      - run: |
          echo "REPLY_FILE=$RUNNER_TEMP/reply.md" >> "$GITHUB_ENV"
          echo "COMMIT_FILE=$RUNNER_TEMP/commit.txt" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - id: apply
        run: node scripts/credential-from-issue.mjs "$GITHUB_EVENT_PATH"

      - if: steps.apply.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/resume.json
          git commit --author="$AUTHOR" -F "$COMMIT_FILE"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"

      - if: success()
        run: |
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$REPLY_FILE"
          gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY"

      - if: failure()
        run: if [ -s "$REPLY_FILE" ]; then gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$REPLY_FILE"; fi
