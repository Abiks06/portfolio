name: Credential
description: Add, update or remove a credential on the portfolio. Applied automatically for the repo owner only.
title: "Credential"
labels: ["credential"]
body:
  - type: markdown
    attributes:
      value: |
        Submitting this updates `content/resume.json` and redeploys the site within a few minutes. An existing entry is matched by its title and organization; only the fields you fill in are changed.
  - type: dropdown
    id: action
    attributes:
      label: Action
      options: ["Add or update", "Remove"]
    validations:
      required: true
  - type: dropdown
    id: section
    attributes:
      label: Section
      options: ["Certificate", "Work experience", "Education", "Leadership", "Skill"]
    validations:
      required: true
  - type: input
    id: title
    attributes:
      label: Title
      description: Certificate name, job title, degree (BSc, MSc, WASSCE…), leadership role, or skill.
    validations:
      required: true
  - type: input
    id: organization
    attributes:
      label: Organization
      description: Issuer, company, school or organization. For a skill, its group (e.g. Frontend).
    validations:
      required: true
  - type: input
    id: area
    attributes:
      label: Field of study
      description: Education only, e.g. Computer Science.
  - type: input
    id: location
    attributes:
      label: Location
      placeholder: Accra, Ghana
  - type: input
    id: start
    attributes:
      label: Start date
      description: YYYY-MM or YYYY. For a certificate, the date it was issued.
      placeholder: "2026-06"
  - type: input
    id: end
    attributes:
      label: End date
      description: YYYY-MM or YYYY, or "present" if it's ongoing.
      placeholder: "2026-08"
  - type: input
    id: link
    attributes:
      label: Link
      description: Credential URL, or the school's or company's website.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Work experience only. One or two sentences.
  - type: textarea
    id: highlights
    attributes:
      label: Highlights
      description: One per line. Replaces the entry's existing highlights.
  - type: input
    id: keywords
    attributes:
      label: Keywords
      description: Comma-separated, e.g. Java, Spring Boot, PostgreSQL.
